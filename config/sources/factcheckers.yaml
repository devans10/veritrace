# Fact-checking publications used to restrict SearXNG queries in the
# claim-check investigator. Membership here says "this outlet publishes
# ClaimReview-style verdicts" — it does NOT by itself grant corroboration
# credit.
#
# Entries are IFCN signatories (International Fact-Checking Network) wherever
# possible, plus wire-service fact-check desks.

