# Known satirical / parody publications. Match on registrable domain.
# A hit sets the "Satire / parody" category and adds a report note; it DOES
# NOT in itself produce a fabricated-style high-risk band — satire is not
# fabrication, and the scorer caps per-signal contribution.
#
# Each entry cites its basis so adds/removals are reviewable. Entries are the
# publication's own self-identification wherever possible, else a reputable
# third-party description. Keep this list conservative — adding a borderline
# site here mislabels real reporting.
#
# Format: {domain, source, note}

