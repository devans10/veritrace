<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Provenance Check{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #666;
      --surface: #fafafa;
      --border: #e2e2e2;
      --low: #2a7a2a;
      --high: #a3301b;
      --uncertain: #a56800;
    }
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; max-width: 920px; margin: 2rem auto; padding: 0 1rem; color: var(--text); }
    h1 { margin-top: 0; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin-top: 2rem; }
    .notice { background: var(--surface); border-left: 4px solid var(--border); padding: 0.8rem 1rem; margin: 1rem 0; font-size: 0.95rem; color: var(--muted); }
    .band { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 4px; font-weight: 600; font-size: 1.1rem; }
    .band.low_risk    { background: #e6f4e6; color: var(--low); }
    .band.high_risk   { background: #fbe9e5; color: var(--high); }
    .band.uncertain   { background: #fdf3dd; color: var(--uncertain); }
    .mute { color: var(--muted); font-size: 0.9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.5rem; }
    .card { border: 1px solid var(--border); border-radius: 4px; padding: 0.6rem 0.8rem; background: var(--surface); }
    .card .num { font-size: 1.3rem; font-weight: 600; }
    .evidence { border: 1px solid var(--border); border-radius: 4px; padding: 0.6rem 0.8rem; margin: 0.4rem 0; background: var(--surface); }
    .evidence .dir { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.8rem; font-weight: 600; }
    .evidence .dir.supports { background: #e6f4e6; color: var(--low); }
    .evidence .dir.undermines { background: #fbe9e5; color: var(--high); }
    .evidence .dir.neutral { background: var(--surface); color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    form { margin: 1rem 0; }
    form input[type=text], form textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
    form textarea { height: 8rem; font-family: inherit; }
    form .row { display: flex; gap: 0.5rem; align-items: center; }
    form button { padding: 0.5rem 1rem; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    form button:hover { background: var(--surface); }
    .status { padding: 0.3rem 0.6rem; border-radius: 3px; display: inline-block; font-size: 0.9rem; }
    .status.queued, .status.capturing, .status.extracting, .status.investigating, .status.scoring { background: #e4f0fa; color: #1a5a99; }
    .status.complete { background: #e6f4e6; color: var(--low); }
    .status.failed { background: #fbe9e5; color: var(--high); }
    ul { padding-left: 1.3rem; }
    li { margin: 0.2rem 0; }
    details > summary { cursor: pointer; font-weight: 600; margin: 0.5rem 0; }
    .unverified li { color: var(--muted); }
  </style>
</head>
<body>
  <nav><a href="/">Home</a></nav>
  {% block content %}{% endblock %}
  <footer class="mute" style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border);">
    Provenance Check — assessments with an evidence trail, not verdicts.
  </footer>
</body>
</html>
