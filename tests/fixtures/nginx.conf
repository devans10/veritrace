server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { return 200 "ok"; }
    location = /redirect { return 302 /article.html; }
    location = /redirect-to-metadata { return 302 http://169.254.169.254/latest/meta-data/; }
    location = /redirect-to-postgres { return 302 http://postgres:5432/; }
}
