<h1>Harbor Bridge Reopens After Two-Year Renovation</h1>
<p>The Harbor Bridge in Port Ellis reopened to traffic on Friday after a two-year renovation
costing 84 million dollars, city officials said.</p>
<p>Mayor Dana Whitfield said the bridge now carries a dedicated bicycle lane.</p>
